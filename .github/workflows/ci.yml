name: CI

on:
  push:
    branches: [main, develop]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "20"

jobs:
  # ---------------------------------------------------------------- static analysis
  lint-backend:
    name: Lint & type-check (backend)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - name: Ruff format check
        run: ruff format --check backend/app backend/tests
      - name: Ruff lint
        run: ruff check backend/app backend/tests
      - name: mypy (strict on app/)
        working-directory: backend
        run: mypy app/ --ignore-missing-imports
      - name: bandit
        run: bandit -r backend/app -ll -x backend/tests
      - name: Generate a development .env file (compose reads env_file)
        run: ./ops/scripts/dev_env.sh
      - name: Compose file is valid and uses the real worker module
        run: |
          set +e
          docker compose config --quiet 2>&1 | tee /tmp/compose.log
          if [ "${PIPESTATUS[0]}" -ne 0 ]; then
            echo "::error title=docker compose rejected docker-compose.yml::$(grep -m1 -iE 'error|invalid' /tmp/compose.log | cut -c1-400)"
            exit 1
          fi
          # The workers used to reference app.workers (plural), which does not exist.
          ! grep -q "app.workers" docker-compose.yml

  # ---------------------------------------------------------------- contract + schema
  contract:
    name: API contract & DB schema
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoclip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements-dev.txt pyyaml
      # pg_dump must match the server's major version or it refuses to run, and the runner's
      # default client is older than the pg17 service container.
      - name: Install PostgreSQL 17 client
        run: |
          sudo install -d /usr/share/postgresql-common/pgdg
          sudo curl -fsSL https://www.postgresql.org/media/keys/ACCC4CF8.asc \
            -o /usr/share/postgresql-common/pgdg/apt.postgresql.org.asc
          . /etc/os-release
          echo "deb [signed-by=/usr/share/postgresql-common/pgdg/apt.postgresql.org.asc] \
          https://apt.postgresql.org/pub/repos/apt ${VERSION_CODENAME}-pgdg main" \
            | sudo tee /etc/apt/sources.list.d/pgdg.list >/dev/null
          sudo apt-get update -qq
          sudo apt-get install -y -qq postgresql-client-17
          psql --version && pg_dump --version
      - name: OpenAPI contract checks
        run: python3 ops/scripts/validate_openapi.py
      # Failures here are annotated with the first SQL error, so a red check is readable from the
      # PR page instead of sending people to the raw log.
      - name: Schema applies and invariants hold
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: |
          set +e
          psql --version
          pg_isready -d autoclip_test

          if ! psql -d autoclip_test -c "CREATE EXTENSION IF NOT EXISTS citext; CREATE EXTENSION IF NOT EXISTS vector;" > /tmp/ext.log 2>&1; then
            echo "::error title=required extensions are unavailable::$(grep -m1 -E 'ERROR|FATAL' /tmp/ext.log | cut -c1-400)"
            cat /tmp/ext.log
            psql -d autoclip_test -c "SELECT name FROM pg_available_extensions WHERE name IN ('citext','vector','pgcrypto','pg_trgm')"
            exit 1
          fi

          if ! psql -v ON_ERROR_STOP=1 -d autoclip_test -f docs/database/schema.sql > /tmp/schema.log 2>&1; then
            echo "::error title=schema.sql does not apply::$(grep -m1 -E 'ERROR|FATAL' /tmp/schema.log | cut -c1-400)"
            grep -nE 'ERROR|FATAL' /tmp/schema.log | head -5
            tail -20 /tmp/schema.log
            exit 1
          fi

          # The script reports through RAISE NOTICE, which psql writes to *stderr* — merging the
          # streams is what makes "PASS:" visible at all. (It used to be greped from stdout only,
          # so this job could never pass.)
          psql -d autoclip_test -f docs/database/verify_invariants.sql > /tmp/inv.log 2>&1
          inv_rc=$?
          grep -E 'PASS:|FAIL:' /tmp/inv.log
          echo "invariants: exit=$inv_rc pass=$(grep -c 'PASS:' /tmp/inv.log) fail=$(grep -c 'FAIL:' /tmp/inv.log)"

          if grep -q 'FAIL:' /tmp/inv.log; then
            echo "::error title=schema invariants failed::$(grep -m1 'FAIL:' /tmp/inv.log | cut -c1-400)"
            exit 1
          fi
          if grep -qE 'ERROR:|FATAL:' /tmp/inv.log; then
            echo "::error title=verify_invariants.sql raised SQL errors::$(grep -m1 -E 'ERROR:|FATAL:' /tmp/inv.log | cut -c1-350)"
            exit 1
          fi
          if ! grep -q 'PASS:' /tmp/inv.log; then
            echo "::error title=verify_invariants.sql asserted nothing::exit=$inv_rc output=$(head -3 /tmp/inv.log | tr '\n' ' ' | cut -c1-350)"
            exit 1
          fi
      # A bash script, not Python — calling it with python3 only ever produced a SyntaxError.
      # Renders real media to prove the fixtures are valid, so FFmpeg is required.
      - name: Install FFmpeg for the fixture check
        run: sudo apt-get install -y -qq ffmpeg
      - name: Config file validity
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: bash ops/scripts/phase0_verify.sh
      - name: Migration matches schema.sql
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
        run: ./ops/scripts/verify_migrations.sh

  # ---------------------------------------------------------------- unit tests
  test-unit:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - run: pip install -r backend/requirements-dev.txt
      - name: pytest (unit)
        working-directory: backend
        # Fast feedback only. Coverage is measured in the integration job, over *both* suites:
        # measured on unit tests alone it says nothing about the routes and repositories, which
        # are only exercised end to end.
        run: pytest tests/unit

  # ---------------------------------------------------------------- integration
  test-integration:
    name: Integration tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: autoclip_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres" --health-interval 5s
          --health-timeout 5s --health-retries 20
      redis:
        image: redis:8-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping" --health-interval 5s
          --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg libgl1 libglib2.0-0
      - run: pip install -r backend/requirements-dev.txt
      - name: Generate media fixtures
        run: ./ops/scripts/make_fixtures.sh
      - name: pytest (integration)
        working-directory: backend
        env:
          TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/autoclip_test
          TEST_REDIS_URL: redis://localhost:6379/15
        run: |
          pytest tests/unit tests/integration -v \
            --cov=app --cov-report=term-missing --cov-fail-under=60

  # ---------------------------------------------------------------- frontend
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install (skipped until Phase 1 scaffolding lands)
        working-directory: frontend
        run: |
          if [ -f package.json ]; then npm ci; else echo "no package.json yet — Phase 1"; fi
      - name: Typecheck / lint / build
        working-directory: frontend
        run: |
          if [ -f package.json ]; then
            npm run lint && npm run typecheck && npm test && npm run build
          else
            echo "skipped — Phase 1"
          fi

  # ---------------------------------------------------------------- security
  security:
    name: Security scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: pip-audit
        run: |
          pip install pip-audit
          # Blocking: an unresolved CVE must not reach main. Ignore specific advisories only
          # through a reviewed change to this workflow, never with `|| true`.
          pip-audit -r backend/requirements.txt --strict
      - name: Secret scan
        run: |
          if grep -rInE '(sk-[A-Za-z0-9]{20,}|ya29\.[A-Za-z0-9_-]{20,}|AIza[A-Za-z0-9_-]{35})' \
              --exclude-dir=.git --exclude-dir=node_modules . ; then
            echo "::error::possible credential committed"; exit 1
          fi
          echo "no credential patterns found"

  # ---------------------------------------------------------------- no fake logic
  no-fakes:
    name: No fake behaviour in production code
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan app/ for test-only or fake-success branches
        run: |
          HITS=$(grep -rn --include=*.py -E \
            '(if +.*environment *=+ *"test"|FAKE_|DUMMY_|MOCK_|return +\{?["'"'"']success["'"'"'])' \
            backend/app/ || true)
          if [ -n "$HITS" ]; then echo "$HITS"; echo "::error::found test/fake logic in app/"; exit 1; fi
          echo "clean"
