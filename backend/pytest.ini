[pytest]
testpaths = tests
asyncio_default_fixture_loop_scope = function
addopts = -q --strict-markers
markers =
    unit: fast, no external I/O
    integration: needs postgres/redis/ffmpeg
    e2e: full stack
    slow: long-running
pythonpath = .
# Integration tests need PostgreSQL + Redis; run with: pytest -m integration
filterwarnings =
    error::DeprecationWarning:app.*
