# =====================================================================================
# Editing template: educational
# Explanation-driven. Keyword emphasis, light zoom, no music.
# Templates are DATA compiled into a RenderPlan. Structural guarantees (no pitch change,
# no fabricated words, no cuts inside a word) are enforced by the renderer, not by config.
# =====================================================================================
key: educational
label: Educational
description: Explanation-driven. Keyword emphasis, light zoom, no music.

canvas:
  width: 1080
  height: 1920
  fps: 30
  background: "#0F1115"
  safe_margin_top_px: 160
  safe_margin_bottom_px: 320
  safe_margin_side_px: 64

reframe:
  strategy: letterbox                 # active_speaker | split_screen | letterbox
  fallbacks: [subject_centroid, centered]
  smoothing_ms: 400
  min_dwell_ms: 1200
  face_padding_ratio: 0.18
  allow_dynamic_switch: true
  cut_on_scene_boundary_only: true

captions:
  style_key: bold_keyword
  font_family: Inter
  font_size_px: 62
  font_weight: 800
  max_words_per_cue: 6
  max_lines: 2
  position: lower_third
  outline_px: 6
  shadow: true
  highlight_keywords: true
  keyword_color: "#7BD389"
  text_color: "#FFFFFF"
  box_opacity: 0.55
  uppercase: false

zoom:
  enabled: true
  style: subtle_emphasis
  max_scale: 1.08
  on: keyword_moments
  transition_ms: 250

silence:
  trim: true
  min_silence_ms: 400
  keep_padding_ms: 120
  never_cut_within_word: true

audio:
  loudnorm: true
  denoise: true
  music:
    enabled: false
    track: null
    gain_db: -22
    duck_under_speech_db: -8

branding:
  watermark:
    enabled: true
    asset: null
    position: top_left
    width_px: 160
    opacity: 0.85
  intro: { enabled: false, asset: null, max_duration_ms: 1200 }
  outro: { enabled: false, asset: null, max_duration_ms: 1500 }

transitions:
  type: none
  duration_ms: 200

overlays:
  progress_bar: false
  subscribe_prompt: false
