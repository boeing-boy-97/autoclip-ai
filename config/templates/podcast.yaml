# =====================================================================================
# Editing template: podcast
# Templates are DATA, compiled into a RenderPlan. No template may change pitch, fabricate
# words, or cut inside a word — those are structural guarantees of the renderer, not flags.
# =====================================================================================
key: podcast
label: Podcast
description: Two-person conversation. Speaker-aware crop, bold captions, minimal effects.

canvas:
  width: 1080
  height: 1920
  fps: 30
  background: "#0F1115"
  safe_margin_top_px: 160
  safe_margin_bottom_px: 320      # keeps captions clear of platform UI
  safe_margin_side_px: 64

reframe:
  strategy: active_speaker         # active_speaker | split_screen | letterbox
  fallbacks: [subject_centroid, centered]
  smoothing_ms: 400
  min_dwell_ms: 1200               # prevents ping-ponging between adjacent faces
  face_padding_ratio: 0.18
  allow_dynamic_switch: true
  cut_on_scene_boundary_only: true

captions:
  style_key: bold_center
  font_family: Inter
  font_size_px: 64
  font_weight: 800
  max_words_per_cue: 4
  max_lines: 2
  position: lower_third
  outline_px: 6
  shadow: true
  highlight_keywords: true
  keyword_color: "#FFD166"
  text_color: "#FFFFFF"
  box_opacity: 0.0
  uppercase: false

zoom:
  enabled: true
  style: subtle_emphasis
  max_scale: 1.06
  on: keyword_moments
  transition_ms: 250

silence:
  trim: true
  min_silence_ms: 450
  keep_padding_ms: 120
  never_cut_within_word: true

audio:
  loudnorm: true
  denoise: false
  music:
    enabled: false
    track: null
    gain_db: -22
    duck_under_speech_db: -8

branding:
  watermark:
    enabled: true
    asset: null
    position: top_right
    width_px: 160
    opacity: 0.85
  intro: { enabled: false, asset: null, max_duration_ms: 1200 }
  outro: { enabled: false, asset: null, max_duration_ms: 1500 }

transitions:
  type: none                       # none | fade | cut
  duration_ms: 200

overlays:
  progress_bar: false
  subscribe_prompt: false
