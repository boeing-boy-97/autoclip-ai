# =====================================================================================
# AutoClipper AI — local development stack
#   ./ops/scripts/dev_env.sh      # creates .env with real secrets (once)
#   docker compose up --build
#
# Services: postgres, redis, minio (S3-compatible), api, web, one container per Celery
# queue that actually has a consumer (media, transcribe, analyze) and a single beat.
#
# Infrastructure ports are bound to 127.0.0.1: this stack is for a developer's machine, not
# for a shared host. Only the API (8000) and the web app (3000) are reachable from outside.
# =====================================================================================
name: autoclip

x-backend-env: &backend-env
  ENVIRONMENT: development
  LOG_FORMAT: console
  DATABASE_URL: postgresql+psycopg://autoclip:autoclip@postgres:5432/autoclip
  DATABASE_URL_MIGRATIONS: postgresql+psycopg://autoclip:autoclip@postgres:5432/autoclip
  REDIS_URL: redis://redis:6379/0
  CELERY_BROKER_URL: redis://redis:6379/1
  CELERY_RESULT_BACKEND: redis://redis:6379/2
  STORAGE_BACKEND: ${STORAGE_BACKEND:-s3}
  S3_ENDPOINT_URL: http://minio:9000
  S3_BUCKET: ${S3_BUCKET:-autoclip-dev}
  S3_REGION: us-east-1
  S3_ACCESS_KEY_ID: ${S3_ACCESS_KEY_ID:-autoclip}
  S3_SECRET_ACCESS_KEY: ${S3_SECRET_ACCESS_KEY:-autoclip123}
  S3_FORCE_PATH_STYLE: "true"
  TMP_ROOT: /tmp/autoclip
  AI_PROVIDER: ${AI_PROVIDER:-none}
  AI_API_KEY: ${AI_API_KEY:-}
  YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID:-}
  YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET:-}
  YOUTUBE_REDIRECT_URI: http://localhost:8000/api/v1/youtube/oauth/callback

x-worker: &worker
  build:
    context: .
    dockerfile: backend/Dockerfile
    target: dev
  env_file: [.env]
  environment: *backend-env
  volumes:
    - ./backend:/app
    - ./config:/app/config:ro
    - media_tmp:/tmp/autoclip
  depends_on:
    postgres: {condition: service_healthy}
    redis: {condition: service_healthy}
  restart: unless-stopped
  # Workers and beat expose no HTTP port, so the image's readiness probe does not apply to them.
  healthcheck: {disable: true}

services:
  postgres:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: autoclip
      POSTGRES_PASSWORD: autoclip
      POSTGRES_DB: autoclip
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autoclip -d autoclip"]
      interval: 5s
      timeout: 5s
      retries: 20
    command: >
      postgres -c max_connections=200 -c shared_buffers=512MB
               -c work_mem=16MB -c log_min_duration_statement=500

  redis:
    image: redis:8-alpine
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    command: redis-server --appendonly yes --maxmemory 512mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    # Pin the tag for reproducibility: `latest` changes object-store behaviour between builds.
    image: ${MINIO_IMAGE:-quay.io/minio/minio:RELEASE.2025-04-22T22-12-26Z}
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-autoclip}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-autoclip123}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10

  minio-init:
    image: quay.io/minio/mc:RELEASE.2025-04-16T18-13-26Z
    depends_on:
      minio: {condition: service_healthy}
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY_ID:-autoclip} ${S3_SECRET_ACCESS_KEY:-autoclip123} &&
      mc mb --ignore-existing local/${S3_BUCKET:-autoclip-dev} &&
      mc anonymous set none local/${S3_BUCKET:-autoclip-dev} &&
      echo 'bucket ready'"
    restart: "no"

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
      target: dev
    env_file: [.env]
    environment:
      <<: *backend-env
      PUBLIC_API_URL: http://localhost:8000
      PUBLIC_WEB_URL: http://localhost:3000
      CORS_ALLOWED_ORIGINS: http://localhost:3000
    volumes:
      - ./backend:/app
      - ./config:/app/config:ro
      - media_tmp:/tmp/autoclip
    ports: ["8000:8000"]
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
      minio-init: {condition: service_completed_successfully}
    healthcheck:
      # readyz, not livez: the API is only useful when the database, Redis, storage and FFmpeg
      # all answer. livez is always 200 and would report a broken deployment as healthy.
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/api/v1/health/readyz"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  # --- one worker per queue that has a consumer ----------------------------------
  # Queues without a task (render, qa, publish, analytics) deliberately have no worker: a
  # container that can never receive work is a false claim of capability.
  worker-media:
    <<: *worker
    command: celery -A app.worker.celery_app worker -Q media -c ${WORKER_CONCURRENCY_MEDIA:-2} -n media@%h --max-tasks-per-child=50 --loglevel=INFO

  worker-transcribe:
    <<: *worker
    command: celery -A app.worker.celery_app worker -Q transcribe -c ${WORKER_CONCURRENCY_TRANSCRIBE:-1} -n transcribe@%h --max-tasks-per-child=10 --loglevel=INFO

  worker-analyze:
    <<: *worker
    command: celery -A app.worker.celery_app worker -Q analyze -c ${WORKER_CONCURRENCY_ANALYZE:-4} -n analyze@%h --max-tasks-per-child=100 --loglevel=INFO

  # Exactly one beat instance, running the stuck-job sweeper. The schedule file lives on the
  # shared volume: on ephemeral /tmp a restart would forget its schedule and re-fire immediately.
  beat:
    <<: *worker
    command: >
      sh -c "mkdir -p /tmp/autoclip &&
             celery -A app.worker.celery_app beat --loglevel=INFO
                    --schedule /tmp/autoclip/celerybeat-schedule"

  # --- frontend ---
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      target: runner
    environment:
      NODE_ENV: production
      # The rewrite in frontend/next.config.mjs proxies /api/v1/* here, which is what keeps the
      # session cookie first-party.
      API_INTERNAL_URL: http://api:8000
      HOSTNAME: 0.0.0.0
    ports: ["3000:3000"]
    depends_on:
      api: {condition: service_healthy}
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  miniodata:
  media_tmp:
